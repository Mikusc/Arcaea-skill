name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update workflow
        run: python -m unittest discover -s skills/arcaea-update-publisher/tests -v
      - name: Pack workflow
        run: python -m unittest discover -s skills/arcaea-pack-intro-publisher/tests -v
